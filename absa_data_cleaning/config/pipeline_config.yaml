# pipeline_config.yaml
# =====================
# Tham số cho từng bước, tách khỏi code. Thứ tự các bước khai báo ở
# pipelines/pipeline_full.py::STAGES (theo kế hoạch tiền xử lý, Giai đoạn 0-7).
# Khoá = tên hàm trong transforms/stage*.py.
#
# TODO: đọc file này trong pipelines/pipeline_full.run().

stage3_coarse_filter:
  split_non_vietnamese_reviews:
    min_confidence: 0.95   # ngưỡng tỉ lệ từ tiếng Anh; dòng vượt/không vượt đều vào suspect, không xoá tự động

stage5_short_filter:
  split_short_reviews:
    max_words: 4

stage7_final_dedup:
  split_near_duplicate_reviews:
    similarity_threshold: 0.9
  split_cross_file_near_duplicates:
    similarity_threshold: 0.9
